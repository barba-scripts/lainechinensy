name: Update social embeds
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: social-embeds
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch latest posts and videos
        id: sync
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_LOGIN_MODE: ${{ vars.INSTAGRAM_LOGIN_MODE || 'facebook' }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v25.0' }}
        run: python scripts/sync_social.py
      - name: Save updated embeds
        id: save
        shell: bash
        run: |
          if git diff --quiet -- index.html art.html gospel.html; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html art.html gospel.html
            git commit -m 'Update social embeds'
            git pull --rebase origin main
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # A push using GITHUB_TOKEN does not trigger a branch-based Pages build.
      - uses: actions/configure-pages@v5
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
      - name: Prepare public files
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir _site
          cp ./*.html CNAME _site/
          cp -r css images js _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
      - name: Report incomplete sync
        if: steps.sync.outcome == 'failure'
        run: exit 1
